# 使用 GITHUB_TOKEN 打包并上传 Velopack 资源。
# 建议在推送 v* 标签，或在 Actions 里手动运行。
# 不要在每次推送到 main 时自动发布。
name: Release Velopack

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Get version from project file
        id: get-version
        shell: bash
        run: |
          version="$(grep -oP '(?<=<Version>)[^<]+' StudentScoreTool/StudentScoreTool.csproj | head -n 1)"
          if [ -z "$version" ]; then
            echo "未能从 csproj 读取版本号" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="${{ steps.get-version.outputs.version }}"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$expected" ]; then
            echo "标签 $GITHUB_REF_NAME 与项目版本 $expected 不一致" >&2
            exit 1
          fi

      - name: Publish application
        run: >
          dotnet publish StudentScoreTool/StudentScoreTool.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous Velopack release
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir Releases
          --channel win

      - name: Pack with Velopack
        run: >
          vpk pack
          --packId DataMatchingAssistant
          --packVersion ${{ steps.get-version.outputs.version }}
          --packDir publish
          --packTitle 数据匹配助手
          --packAuthors Seul_SC_照晨
          --mainExe DataMatchingAssistant.exe
          --icon StudentScoreTool/Assets/app.ico
          --releaseNotes packaging/release-notes.md
          --outputDir Releases
          --channel win

      - name: Upload to GitHub Releases
        run: >
          vpk upload github
          --outputDir Releases
          --channel win
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "数据匹配助手 ${{ steps.get-version.outputs.version }}"
          --tag ${{ steps.get-version.outputs.tag }}
